# TalentPulse — Render Blueprint (backend)
# Dashboard: New → Blueprint → this repo
#
# Before apply:
# 1) Create a free CloudAMQP instance → copy host / user / password
# 2) You will paste those when Render prompts (sync: false)
# 3) After first Postgres is up, open its Shell and run:
#      CREATE DATABASE talentpulse_auth;
#      CREATE DATABASE talentpulse_job;
#      CREATE DATABASE talentpulse_candidate;
#      CREATE DATABASE talentpulse_scoring;
#      CREATE DATABASE talentpulse_notification;
#
# Then deploy Vercel frontend with:
#   NEXT_PUBLIC_API_URL=https://<talentpulse-gateway>.onrender.com

services:
  - type: web
    name: talentpulse-gateway
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/api-gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: TALENTPULSE_AUTH_URL
        value: http://talentpulse-auth:10000
      - key: TALENTPULSE_JOB_URL
        value: http://talentpulse-job:10000
      - key: TALENTPULSE_CANDIDATE_URL
        value: http://talentpulse-candidate:10000
      - key: TALENTPULSE_SCORING_URL
        value: http://talentpulse-scoring:10000
      - key: TALENTPULSE_NOTIFICATION_URL
        value: http://talentpulse-notification:10000

  - type: web
    name: talentpulse-auth
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/auth-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_NAME
        value: talentpulse_auth
      - key: DB_HOST
        fromDatabase:
          name: talentpulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: talentpulse-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: talentpulse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: talentpulse-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: TALENTPULSE_FRONTEND_URL
        sync: false
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false

  - type: web
    name: talentpulse-job
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/job-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_NAME
        value: talentpulse_job
      - key: DB_HOST
        fromDatabase:
          name: talentpulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: talentpulse-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: talentpulse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: talentpulse-db
          property: password
      - key: JWT_SECRET
        fromService:
          type: web
          name: talentpulse-auth
          envVarKey: JWT_SECRET
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false

  - type: web
    name: talentpulse-candidate
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/candidate-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
