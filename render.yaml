  - type: web
    name: talentpulse-notification
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/notification-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_NAME
        value: talentpulse_notification
      - key: DB_HOST
        fromDatabase:
          name: talentpulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: talentpulse-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: talentpulse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: talentpulse-db
          property: password
      - key: JWT_SECRET
        fromService:
          type: web
          name: talentpulse-auth
          envVarKey: JWT_SECRET
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false

databases:
  - name: talentpulse-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
