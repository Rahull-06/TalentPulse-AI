        value: "10000"
      - key: DB_NAME
        value: talentpulse_candidate
      - key: DB_HOST
        fromDatabase:
          name: talentpulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: talentpulse-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: talentpulse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: talentpulse-db
          property: password
      - key: JWT_SECRET
        fromService:
          type: web
          name: talentpulse-auth
          envVarKey: JWT_SECRET
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false

  - type: web
    name: talentpulse-scoring
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/scoring-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_NAME
        value: talentpulse_scoring
      - key: DB_HOST
        fromDatabase:
          name: talentpulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: talentpulse-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: talentpulse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: talentpulse-db
          property: password
      - key: JWT_SECRET
        fromService:
          type: web
          name: talentpulse-auth
          envVarKey: JWT_SECRET
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
