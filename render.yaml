# TalentPulse — Render Blueprint (backend)
# Dashboard: New → Blueprint → this repo
#
# Before apply:
# 1) Create a free CloudAMQP instance → copy host / user / password
# 2) You will paste those when Render prompts (sync: false)
# 3) All services share the single Render Postgres database (no CREATE DATABASE needed)
#
# Then deploy Vercel frontend with:
#   NEXT_PUBLIC_API_URL=https://<talentpulse-gateway>.onrender.com

services:
  - type: web
    name: talentpulse-gateway
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/api-gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "10000"
      # Free web services cannot RECEIVE private network traffic, so route
      # through public URLs instead of internal <service>:10000 addresses.
      - key: TALENTPULSE_AUTH_URL
        value: https://talentpulse-auth.onrender.com
      - key: TALENTPULSE_JOB_URL
        value: https://talentpulse-job.onrender.com
      - key: TALENTPULSE_CANDIDATE_URL
        value: https://talentpulse-candidate.onrender.com
      - key: TALENTPULSE_SCORING_URL
        value: https://talentpulse-scoring.onrender.com
      - key: TALENTPULSE_NOTIFICATION_URL
        value: https://talentpulse-notification.onrender.com

  - type: web
    name: talentpulse-auth
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/auth-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_NAME
        fromDatabase:
          name: talentpulse-db
          property: database
      - key: DB_HOST
        fromDatabase:
          name: talentpulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: talentpulse-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: talentpulse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: talentpulse-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: TALENTPULSE_FRONTEND_URL
        sync: false
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_VHOST
        sync: false

  - type: web
    name: talentpulse-job
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/job-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_NAME
        fromDatabase:
          name: talentpulse-db
          property: database
      - key: DB_HOST
        fromDatabase:
          name: talentpulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: talentpulse-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: talentpulse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: talentpulse-db
          property: password
      - key: JWT_SECRET
        fromService:
          type: web
          name: talentpulse-auth
          envVarKey: JWT_SECRET
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_VHOST
        sync: false

  - type: web
    name: talentpulse-candidate
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/candidate-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      # Writable on free tier (ephemeral; parsed text lives in Postgres).
      - key: TALENTPULSE_RESUME_DIR
        value: /tmp/talentpulse/resumes
      # JobClient fetches job skills when a candidate applies.
      - key: TALENTPULSE_JOB_URL
        value: https://talentpulse-job.onrender.com
      - key: DB_NAME
        fromDatabase:
          name: talentpulse-db
          property: database
      - key: DB_HOST
        fromDatabase:
          name: talentpulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: talentpulse-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: talentpulse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: talentpulse-db
          property: password
      - key: JWT_SECRET
        fromService:
          type: web
          name: talentpulse-auth
          envVarKey: JWT_SECRET
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_VHOST
        sync: false

  - type: web
    name: talentpulse-scoring
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/scoring-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_NAME
        fromDatabase:
          name: talentpulse-db
          property: database
      - key: DB_HOST
        fromDatabase:
          name: talentpulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: talentpulse-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: talentpulse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: talentpulse-db
          property: password
      - key: JWT_SECRET
        fromService:
          type: web
          name: talentpulse-auth
          envVarKey: JWT_SECRET
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_VHOST
        sync: false

  - type: web
    name: talentpulse-notification
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./services/notification-service/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_NAME
        fromDatabase:
          name: talentpulse-db
          property: database
      - key: DB_HOST
        fromDatabase:
          name: talentpulse-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: talentpulse-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: talentpulse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: talentpulse-db
          property: password
      - key: JWT_SECRET
        fromService:
          type: web
          name: talentpulse-auth
          envVarKey: JWT_SECRET
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_VHOST
        sync: false

databases:
  - name: talentpulse-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
