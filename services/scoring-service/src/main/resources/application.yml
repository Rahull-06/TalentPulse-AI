server:
  port: ${PORT:8084}

spring:
  application:
    name: scoring-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talentpulse_scoring}
    username: ${SPRING_DATASOURCE_USERNAME:talentpulse}
    password: ${SPRING_DATASOURCE_PASSWORD:talentpulse}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: scoring
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: scoring
    default-schema: scoring
    create-schemas: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:talentpulse}
    password: ${RABBITMQ_PASSWORD:talentpulse}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        missing-queues-fatal: false
        possible-authentication-failure-fatal: false

talentpulse:
  security:
    jwt:
      secret: "${JWT_SECRET:TalentPulseAuthSecretKeyMustBeAtLeast32CharsLong!}"
  events:
    enabled: true
  scoring:
    # Set GEMINI_API_KEY to enable AI scoring; otherwise rule-based matching uses resume text.
    ai-enabled: ${SCORING_AI_ENABLED:true}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.talentpulse.scoring: DEBUG
