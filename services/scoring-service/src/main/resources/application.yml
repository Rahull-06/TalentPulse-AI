server:
  port: 8084

spring:
  application:
    name: scoring-service

  datasource:
    url: jdbc:postgresql://localhost:5432/talentpulse_scoring
    username: talentpulse
    password: talentpulse
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:talentpulse}
    password: ${RABBITMQ_PASSWORD:talentpulse}

talentpulse:
  security:
    jwt:
      secret: "TalentPulseAuthSecretKeyMustBeAtLeast32CharsLong!"
  events:
    enabled: true
  scoring:
    ai-enabled: false
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.0-flash

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.talentpulse.scoring: DEBUG
