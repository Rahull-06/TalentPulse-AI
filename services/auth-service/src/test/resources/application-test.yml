spring:
  datasource:
    url: jdbc:h2:mem:talentpulse_auth_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

talentpulse:
  security:
    jwt:
      secret: "TestOnlySecretKeyMustBeAtLeast32Characters!"
      access-token-expiry-minutes: 15
      refresh-token-expiry-days: 7
  events:
    enabled: false

logging:
  level:
    root: WARN
    com.talentpulse.auth: INFO
