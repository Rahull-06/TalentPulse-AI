server:
  port: ${PORT:8085}

spring:
  application:
    name: notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talentpulse_notification}
    username: ${SPRING_DATASOURCE_USERNAME:talentpulse}
    password: ${SPRING_DATASOURCE_PASSWORD:talentpulse}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:talentpulse}
    password: ${RABBITMQ_PASSWORD:talentpulse}

talentpulse:
  security:
    jwt:
      secret: ${JWT_SECRET:TalentPulseAuthSecretKeyMustBeAtLeast32CharsLong!}
  events:
    enabled: true
  mail:
    enabled: false
    from: noreply@talentpulse.local

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.talentpulse.notification: DEBUG
