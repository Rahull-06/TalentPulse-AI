spring:
  datasource:
    url: jdbc:h2:mem:talentpulse_notification_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

talentpulse:
  security:
    jwt:
      secret: "TestOnlySecretKeyMustBeAtLeast32Characters!"
  events:
    enabled: false
  mail:
    enabled: false
    from: noreply@test.local

logging:
  level:
    root: WARN
    com.talentpulse.notification: INFO
