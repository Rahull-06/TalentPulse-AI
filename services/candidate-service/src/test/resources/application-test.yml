spring:
  datasource:
    url: jdbc:h2:mem:talentpulse_candidate_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

talentpulse:
  security:
    jwt:
      secret: "TestOnlySecretKeyMustBeAtLeast32Characters!"
  storage:
    resume-dir: ./target/test-resumes
  events:
    enabled: false

logging:
  level:
    root: WARN
    com.talentpulse.candidate: INFO
