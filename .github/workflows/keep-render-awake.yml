# Keep Render free-tier services awake (they sleep after ~15m idle).
# Runs every 12 minutes. Disable this workflow if you hit Render's
# 750 free instance-hours/month limit (Dashboard → Billing).
#
# True always-on without hour limits: upgrade services to Starter in Render.

name: Keep Render awake

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake all TalentPulse services
        shell: bash
        run: |
          set +e
          urls=(
            "https://talentpulse-gateway.onrender.com/actuator/health"
            "https://talentpulse-gateway.onrender.com/api/v1/system/warmup"
            "https://talentpulse-job.onrender.com/actuator/health"
            "https://talentpulse-auth.onrender.com/actuator/health"
            "https://talentpulse-candidate.onrender.com/actuator/health"
            "https://talentpulse-scoring.onrender.com/actuator/health"
            "https://talentpulse-notification.onrender.com/actuator/health"
          )
          for url in "${urls[@]}"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -m 120 "$url" || echo "000")
            echo "$code  $url"
          done
