# Keep Render free-tier services awake (they sleep after ~15m idle).
# Pings run in PARALLEL so the job finishes in ~1 minute, not 10+.
#
# Disable this workflow if you hit Render's 750 free instance-hours/month.
# True always-on: upgrade services to Starter in Render.

name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake all TalentPulse services (parallel)
        shell: bash
        run: |
          set +e
          urls=(
            "https://talentpulse-gateway.onrender.com/actuator/health"
            "https://talentpulse-auth.onrender.com/actuator/health"
            "https://talentpulse-job.onrender.com/actuator/health"
            "https://talentpulse-candidate.onrender.com/actuator/health"
            "https://talentpulse-scoring.onrender.com/actuator/health"
            "https://talentpulse-notification.onrender.com/actuator/health"
            "https://talentpulse-gateway.onrender.com/api/v1/system/warmup"
          )

          ping_one() {
            local url="$1"
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 15 -m 50 "$url" 2>/dev/null || echo "000")
            echo "$code  $url"
          }

          for url in "${urls[@]}"; do
            ping_one "$url" &
          done
          wait
          echo "All wake pings finished."
